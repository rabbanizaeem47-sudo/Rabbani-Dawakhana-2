        <main>
            <h2>Application Form</h2>
            <form action="show-submitted-application.html" method="post" id="application-form">
                <label for="name" >Full Name:</label>
                <input type="text" id="name" name="name"  placeholder="Enter Your Name" required>

                <label for="Father-name">Father Name:</label>
                <input type="text" id="Father-name" name="Father-name" placeholder="Enter Your Father Name" required>

                <label for="Mother-name">Mother Name:</label>
                <input type="text" id="Mother-name" name="Mother-name" placeholder="Enter Your Mother Name" required>

                <label for="CNIC">CNIC:</label>
                <input type="text" id="CNIC" name="CNIC" placeholder="Enter Your CNIC" required>

                <label for="Father-CNIC">Father CNIC:</label>
                <input type="text" id="Father-CNIC" name="Father-CNIC" placeholder="Enter Your Father CNIC" required>

                <label for="Mother-CNIC">Mother CNIC:</label>
                <input type="text" id="Mother-CNIC" name="Mother-CNIC" placeholder="Enter Your Mother CNIC" required>

                <label for="Father-Designation">Father Designation:</label>
                <input type="text" id="Father-Designation" name="Father-Designation" placeholder="Enter Your Father Designation" required>

                <label for="Father-Rank">Father Rank:</label>
                <input type="text" id="Father-Rank" name="Father-Rank" placeholder="Enter Your Father Rank" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter Your Email Address" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter Your Phone Number" required>

                <label for="position">Position Applying For:</label>
                <input type="text" id="position" name="position" placeholder="Enter The Position" required>

                <label for="experience">Relevant Experience:</label>
                <textarea id="experience" name="experience" rows="4" placeholder="Enter Your Experience" required></textarea>

                <label for="resume">Upload Image:</label>
                <input type="file" id="resume" name="resume" accept=".jpg, .png," placeholder="Upload Your Image" required>

                <button type="submit">Submit Application</button>
            </form>
